name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual re-deploy without pushing a commit.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  vercel:
    name: Vercel production
    runs-on: ubuntu-latest

    # Never deploy off a red CI run. workflow_dispatch has no conclusion, so it
    # is allowed through explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Names the cause instead of failing inside `vercel pull` with a generic
      # error. Only reports whether each secret is present, never its value.
      - name: Check required secrets are present
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            case "$name" in
              VERCEL_TOKEN)      value="${{ secrets.VERCEL_TOKEN }}" ;;
              VERCEL_ORG_ID)     value="${{ secrets.VERCEL_ORG_ID }}" ;;
              VERCEL_PROJECT_ID) value="${{ secrets.VERCEL_PROJECT_ID }}" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is missing or empty."
              missing=1
            else
              echo "$name is set (${#value} characters)."
            fi
          done
          exit $missing

      - name: Confirm the token authenticates
        run: vercel whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # Checks the production alias, not the immutable deployment URL that
      # `vercel deploy` prints. That URL sits behind Vercel Deployment
      # Protection and answers 302 to a login page for an unauthenticated
      # caller, which is not a signal about the app at all.
      #
      # Override the domain with a repository variable named PRODUCTION_URL if
      # the project is ever renamed or given a custom domain.
      - name: Verify the deployment is serving
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://blog-inventory.vercel.app' }}
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Verifying against: $PRODUCTION_URL"

          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/api/health" || true)

            if [ "$code" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            if [ "$code" = "302" ] || [ "$code" = "401" ]; then
              echo "::error::$PRODUCTION_URL/api/health returned $code. Vercel Deployment Protection is covering the production alias; disable it for production or make /api/health public."
              exit 1
            fi

            echo "Attempt $i returned $code; retrying."
            sleep 5
          done

          echo "::error::Deployment never returned a healthy response."
          exit 1
